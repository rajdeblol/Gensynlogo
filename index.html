<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gensyn × Minecraft PFP Generator</title>
<style>
  body {
    margin: 0;
    background: #000; /* Black background, can change to another color if needed, e.g., #1a1a1a for dark gray */
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: monospace;
    color: white;
  }
  .box {
    padding: 20px;
    background: #111;
    border-radius: 14px;
    width: 420px;
    text-align: center;
    border: 1px solid #333;
  }
  canvas { 
    margin-top: 18px;
    width: 360px; 
    height: 360px;
    image-rendering: pixelated;
  }
  button {
    margin-top: 10px;
    padding: 8px 14px;
    background: #f4a0a0;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
  }
  input { margin-top: 6px; }
</style>
</head>
<body>

<div class="box">
  <h2>gensyn × minecraft pfp</h2>
  <input type="file" id="upload" accept="image/*">
  <button id="downloadBtn" disabled>download</button>

  <canvas id="c" width="512" height="512"></canvas>
</div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const upload = document.getElementById("upload");
const downloadBtn = document.getElementById("downloadBtn");

let userImg;

upload.addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = ev => {
    userImg = new Image();
    userImg.onload = generate;
    userImg.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

downloadBtn.addEventListener("click", () => {
  const link = document.createElement("a");
  link.download = "gensyn-minecraft-pfp.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
});

function generate() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawMinecraftFrame();
  drawPixelatedAvatar();
  drawLogo();

  downloadBtn.disabled = false;
}

function drawPixelatedAvatar() {
  const pixelSize = 16; // bigger pixel = more Minecraft look
  const size = 350;
  const x = (512 - size) / 2;
  const y = (512 - size) / 2;

  // draw PFP small → scale up → pixelated
  const temp = document.createElement("canvas");
  const tctx = temp.getContext("2d");
  temp.width = temp.height = size / pixelSize;

  // crop square
  const s = Math.min(userImg.width, userImg.height);
  const sx = (userImg.width - s) / 2;
  const sy = (userImg.height - s) / 2;

  tctx.drawImage(userImg, sx, sy, s, s, 0, 0, temp.width, temp.height);

  ctx.imageSmoothingEnabled = false;

  ctx.drawImage(temp, 0, 0, temp.width, temp.height, x, y, size, size);
}

function drawMinecraftFrame() {
  const block = 64;

  for (let i = 0; i < 512; i += block) {
    // top
    ctx.fillStyle = "#3ba12f"; // grass
    ctx.fillRect(i, 0, block, block / 2);
    ctx.fillStyle = "#6b4721"; // dirt
    ctx.fillRect(i, block / 2, block, block / 2);

    // bottom dirt
    ctx.fillStyle = "#6b4721";
    ctx.fillRect(i, 512 - block, block, block);

    // left + right edges
    ctx.fillStyle = "#7c7c7c"; // stone
    ctx.fillRect(0, i, block, block);
    ctx.fillRect(512 - block, i, block, block);
  }
}

function drawLogo() {
  const centerX = 256;
  const centerY = 256;
  const radius = 180;
  const lineWidth = 20;
  ctx.strokeStyle = "#f4a0a0"; // Using the pinkish color from the button for the logo ring
  ctx.lineWidth = lineWidth;
  ctx.beginPath();
  ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
  ctx.stroke();
}
</script>

</body>
</html>
